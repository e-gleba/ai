# markdownlint configuration
# https://github.com/DavidAnson/markdownlint-cli2
config:
  # prose is wrapped by hand; hard limits fight readable tables and links
  MD013: false
  # prompt blocks are plain text on purpose, no language tag
  MD040: false
  # short repeated section names (rules, prompts) are intentional
  MD024: false
  # ordered lists restart inside procedures
  MD029: false
  # bold used as an inline label in list items and index groups
  MD036: false
globs:
  - "**/*.md"
ignores:
  - "node_modules/**"
  # github templates are fragments, not documents: no top-level heading
  - ".github/**"
