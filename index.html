<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Evgeniy Gleba — interactive AI operating system. Explore tools, prompts, skills, and C++ workflows on a living map.">
  <meta name="author" content="Evgeniy Gleba">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#07070b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
  <meta property="og:title" content="e-gleba /ai — AI Operating System">
  <meta property="og:description" content="A living map of how to work with AI — search, click, copy.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://e-gleba.github.io/ai/">
  <title>e-gleba /ai — AI Operating System</title>
  <link rel="canonical" href="https://e-gleba.github.io/ai/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23FF6B9D'/%3E%3Cstop offset='50%25' style='stop-color:%23FF8C42'/%3E%3Cstop offset='100%25' style='stop-color:%23C792EA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2307070b'/%3E%3Cpath d='M44 16 C28 14 14 22 14 32 C14 42 28 50 44 48 M14 32 L38 32 M44 16 C48 17 50 20 48 22' stroke='url(%23g)' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='48' cy='22' r='2.5' fill='%23FF6B9D' opacity='.8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "e-gleba /ai — AI Operating System",
    "url": "https://e-gleba.github.io/ai/",
    "author": { "@type": "Person", "name": "Evgeniy Gleba", "url": "https://e-gleba.github.io" }
  }
  </script>
</head>
<body
  x-data="app()"
  x-cloak
  @keydown.escape.window="palette_open ? close_palette() : close_drawer()"
  @ai-open-palette.window="open_palette()"
>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <a class="brand" href="https://e-gleba.github.io" title="Portfolio">
        <span class="pink">e</span><span class="dim">-</span>gleba<span class="ai">/ai</span>
      </a>

      <button type="button" class="search_launch" @click="open_palette()" aria-label="Open search">
        <span aria-hidden="true">⌕</span>
        <span>Search tools, prompts, skills…</span>
        <span class="kbd" x-text="mod_key">⌘K</span>
      </button>

      <div class="top_actions">
        <div class="theme_switch" role="group" aria-label="Theme">
          <button type="button" class="theme_btn" :class="{ active: theme_mode === 'dark' }" @click="apply_theme('dark')">dark</button>
          <button type="button" class="theme_btn" :class="{ active: theme_mode === 'light' }" @click="apply_theme('light')">light</button>
          <button type="button" class="theme_btn" :class="{ active: theme_mode === 'system' }" @click="apply_theme('system')">auto</button>
        </div>
        <a class="link_quiet" href="https://github.com/e-gleba/ai" target="_blank" rel="noopener">source</a>
      </div>
    </header>

    <main class="stage">
      <div id="graph" role="img" aria-label="Interactive knowledge map of the AI operating system"></div>

      <div class="stage_overlay">
        <div>
          <div class="hero_copy">
            <h1>AI <span class="grad">Operating System</span></h1>
            <p>A living map — click a bubble, or hit search. Built so anyone can explore how Evgeniy works with AI.</p>
          </div>

          <div class="hint_card" x-show="hint_visible" x-transition>
            <strong>Try this</strong>
            <p>Drag the map. Click <em>Tools</em> or <em>Today</em>. Copy anything useful.</p>
            <button type="button" @click="dismiss_hint()">got it</button>
          </div>
        </div>

        <div class="chip_row">
          <template x-for="f in filters" :key="f.id">
            <button
              type="button"
              class="chip"
              :class="{ active: active_filter === f.id }"
              @click="set_filter(f.id)"
              x-text="f.label"
            ></button>
          </template>
          <span class="leg_note" x-text="today_label()"></span>
        </div>
      </div>
    </main>
  </div>

  <!-- Detail drawer -->
  <div
    class="drawer_backdrop"
    x-show="drawer_open"
    x-transition.opacity
    @click="close_drawer()"
  ></div>
  <aside class="drawer" :class="{ open: drawer_open }" @click.stop aria-live="polite">
    <template x-if="selected">
      <div style="display:flex;flex-direction:column;height:100%">
        <div class="drawer_head">
          <div>
            <h2 x-text="selected.title"></h2>
            <span class="kind_pill" x-text="kind_label(selected.kind)"></span>
          </div>
          <button type="button" class="icon_btn" @click="close_drawer()" aria-label="Close">✕</button>
        </div>
        <div class="drawer_body">
          <p class="plain" x-text="selected.plain"></p>
          <div class="body" x-text="selected.body"></div>
        </div>
        <div class="drawer_actions">
          <button type="button" class="btn primary" @click="copy_selected()">copy</button>
          <a
            class="btn"
            x-show="selected.url"
            :href="selected.url"
            target="_blank"
            rel="noopener"
          >open link</a>
          <button type="button" class="btn" @click="open_palette()">search more</button>
        </div>
      </div>
    </template>
  </aside>

  <!-- Command palette -->
  <div
    class="palette_backdrop"
    x-show="palette_open"
    x-transition.opacity
    @click.self="close_palette()"
  >
    <div class="palette" @click.stop role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette_input_wrap">
        <span aria-hidden="true">⌕</span>
        <input
          x-ref="palette_input"
          type="search"
          placeholder="Type anything — Cursor, AGENTS.md, C++, OSINT…"
          x-model="query"
          @input="on_query()"
          @keydown.enter.prevent="confirm_result()"
          @keydown.arrow-down.prevent="move_result(1)"
          @keydown.arrow-up.prevent="move_result(-1)"
        >
        <span class="kbd" style="font-family:var(--font-mono);font-size:11px;color:var(--fg-mute);border:1px solid var(--line);border-radius:6px;padding:3px 7px">esc</span>
      </div>
      <div class="palette_list">
        <template x-if="results.length === 0">
          <div class="palette_empty">No matches — try “prompt”, “skill”, or “clangd”</div>
        </template>
        <template x-for="(item, index) in results" :key="item.id">
          <button
            type="button"
            class="palette_item"
            :class="{ active: index === active_result }"
            @click="open_item(item.id)"
            @mouseenter="active_result = index"
          >
            <span class="kind" x-text="kind_label(item.kind)"></span>
            <span>
              <div class="title" x-text="item.title"></div>
              <div class="plain" x-text="item.plain"></div>
            </span>
          </button>
        </template>
      </div>
      <div class="palette_foot">
        <span>↑↓ enter · click map bubbles</span>
        <span>powered by Fuse.js</span>
      </div>
    </div>
  </div>

  <div class="toast" :class="{ show: toast }" x-text="toast" role="status" aria-live="polite"></div>

  <!-- Libraries: well-starred, CDN, less custom code -->
  <script defer src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0/dist/fuse.min.js"></script>
  <script defer src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
