<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Evgeniy Gleba — interactive AI operating system. Explore tools, prompts, skills, and C++ workflows on a living map.">
  <meta name="author" content="Evgeniy Gleba">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)">
  <meta property="og:title" content="e-gleba /ai — AI Operating System">
  <meta property="og:description" content="A living map of how to work with AI — search, click, copy.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://e-gleba.github.io/ai/">
  <title>e-gleba /ai — AI Operating System</title>
  <link rel="canonical" href="https://e-gleba.github.io/ai/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23FF6363'/%3E%3Cstop offset='100%25' style='stop-color:%23FF8F6B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23000000'/%3E%3Ccircle cx='32' cy='32' r='10' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body
  x-data="app()"
  x-cloak
  @keydown.escape.window="palette_open ? close_palette() : close_drawer()"
  @ai-open-palette.window="open_palette()"
>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <a class="brand" href="https://e-gleba.github.io" title="Portfolio">
        <span class="pink">e</span><span class="dim">-</span>gleba<span class="ai">/ai</span>
      </a>

      <button type="button" class="search_launch glass" @click="open_palette()" aria-label="Open search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="placeholder">Search tools, prompts, skills…</span>
        <span class="kbd" x-text="mod_key">⌘K</span>
      </button>

      <div class="top_actions">
        <div class="icon_group glass" role="group" aria-label="Theme">
          <button type="button" class="icon_btn" :class="{ active: theme_mode === 'dark' }" @click="apply_theme('dark')" aria-label="Dark theme" title="Dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
          </button>
          <button type="button" class="icon_btn" :class="{ active: theme_mode === 'light' }" @click="apply_theme('light')" aria-label="Light theme" title="Light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" class="icon_btn" :class="{ active: theme_mode === 'system' }" @click="apply_theme('system')" aria-label="System theme" title="System">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          </button>
        </div>
        <a class="icon_btn glass" href="https://github.com/e-gleba/ai" target="_blank" rel="noopener" aria-label="Source on GitHub" title="Source">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.48 0-.24-.01-.87-.01-1.7-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.55-1.14-4.55-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.73 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 7.5c.85 0 1.7.12 2.5.34 1.9-1.32 2.74-1.05 2.74-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.8 0 .27.18.59.69.48A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
        </a>
      </div>
    </header>

    <main class="stage">
      <div id="graph" role="img" aria-label="Interactive knowledge map of the AI operating system"></div>

      <div class="stage_overlay" :class="{ is_busy: map_busy || drawer_open }">
        <div>
          <div class="hero_block glass">
            <h1>AI <span class="grad">Operating System</span></h1>
            <p>A living map — search or tap a node. Built so anyone can explore how Evgeniy works with AI.</p>
          </div>

          <div class="hint_card glass" x-show="hint_visible" x-transition.opacity>
            <strong>Try this</strong>
            <p>Drag the map. Tap <em>Tools</em> or today’s node. Copy what you need.</p>
            <button type="button" @click="dismiss_hint()">got it</button>
          </div>
        </div>

        <div class="dock glass">
          <template x-for="f in filters" :key="f.id">
            <button
              type="button"
              class="chip"
              :class="{ active: active_filter === f.id }"
              @click="set_filter(f.id)"
              x-text="f.label"
            ></button>
          </template>
          <span class="leg_note" x-text="today_label()"></span>
        </div>
      </div>
    </main>
  </div>

  <div class="drawer_backdrop" x-show="drawer_open" x-transition.opacity @click="close_drawer()"></div>
  <aside class="drawer" :class="{ open: drawer_open }" @click.stop aria-live="polite">
    <template x-if="selected">
      <div style="display:flex;flex-direction:column;height:100%">
        <div class="drawer_head">
          <div>
            <h2 x-text="selected.title"></h2>
            <span class="kind_pill" x-text="kind_label(selected.kind)"></span>
          </div>
          <button type="button" class="icon_btn" @click="close_drawer()" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="drawer_body">
          <p class="plain" x-text="selected.plain"></p>
          <p class="when_line" x-show="selected.when" x-text="selected.when"></p>

          <!-- Tool limitations -->
          <template x-if="selected.kind === 'tool' && selected.limits?.length">
            <div class="limits_block">
              <h3>Limitations</h3>
              <ul>
                <template x-for="(lim, li) in selected.limits" :key="li">
                  <li x-text="lim"></li>
                </template>
              </ul>
            </div>
          </template>

          <!-- Pipeline subgraph (stages stay out of the global map) -->
          <template x-if="selected.kind === 'pipeline'">
            <div class="pipe_tree" aria-label="Pipeline stages">
              <template x-for="(stage, si) in selected.stages" :key="si">
                <div class="pipe_stage">
                  <div class="pipe_rail" aria-hidden="true">
                    <span class="pipe_dot" x-text="si + 1"></span>
                    <span class="pipe_line" x-show="si < selected.stages.length - 1"></span>
                  </div>
                  <div class="pipe_card">
                    <template x-if="!stage.parallel">
                      <div>
                        <div class="pipe_card_head">
                          <strong x-text="stage.title"></strong>
                          <span class="pipe_tool" x-text="stage.tool"></span>
                        </div>
                        <p class="pipe_note" x-text="stage.note"></p>
                        <button type="button" class="btn tiny" @click="copy_stage(stage)" x-show="stage.prompt">Copy stage prompt</button>
                      </div>
                    </template>
                    <template x-if="stage.parallel">
                      <div>
                        <div class="pipe_card_head">
                          <strong x-text="stage.title"></strong>
                          <span class="pipe_tool">parallel</span>
                        </div>
                        <p class="pipe_note" x-text="stage.note"></p>
                        <div class="pipe_parallel">
                          <template x-for="(branch, bi) in stage.parallel" :key="bi">
                            <div class="pipe_branch">
                              <div class="pipe_card_head">
                                <strong x-text="branch.title"></strong>
                                <span class="pipe_tool" x-text="branch.tool"></span>
                              </div>
                              <p class="pipe_note" x-text="branch.note"></p>
                              <button type="button" class="btn tiny" @click="copy_stage(branch)" x-show="branch.prompt">Copy</button>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <div class="body" x-show="selected.kind !== 'pipeline'" x-text="selected.body"></div>
          <p class="pipe_footnote" x-show="selected.kind === 'pipeline'" x-text="selected.note"></p>
        </div>
        <div class="drawer_actions">
          <button type="button" class="btn primary" @click="selected.kind === 'pipeline' ? copy_pipeline() : copy_selected()" x-text="selected.kind === 'pipeline' ? 'Copy pipeline' : 'Copy'"></button>
          <a class="btn" x-show="selected.url" :href="selected.url" target="_blank" rel="noopener">Open</a>
          <button type="button" class="btn" @click="open_palette()">Search</button>
        </div>
      </div>
    </template>
  </aside>

  <div class="palette_backdrop" x-show="palette_open" x-transition.opacity @click.self="close_palette()">
    <div class="palette" @click.stop role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette_input_wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input
          x-ref="palette_input"
          type="search"
          placeholder="Type anything — Cursor, AGENTS.md, C++, OSINT…"
          x-model="query"
          @input="on_query()"
          @keydown.enter.prevent="confirm_result()"
          @keydown.arrow-down.prevent="move_result(1)"
          @keydown.arrow-up.prevent="move_result(-1)"
        >
        <span class="kbd">esc</span>
      </div>
      <div class="palette_list">
        <template x-if="results.length === 0">
          <div class="palette_empty">No matches — try “prompt”, “skill”, or “clangd”</div>
        </template>
        <template x-for="(item, index) in results" :key="item.id">
          <button
            type="button"
            class="palette_item"
            :class="{ active: index === active_result }"
            @click="open_item(item.id)"
            @mouseenter="active_result = index"
          >
            <span class="kind" x-text="kind_label(item.kind)"></span>
            <span>
              <div class="title" x-text="item.title"></div>
              <div class="plain" x-text="item.plain"></div>
            </span>
          </button>
        </template>
      </div>
      <div class="palette_foot">
        <span>↑↓ enter · click map</span>
        <span>Fuse.js · vis-network</span>
      </div>
    </div>
  </div>

  <div class="toast" :class="{ show: toast }" x-text="toast" role="status" aria-live="polite"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0/dist/fuse.min.js"></script>
  <script defer src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
