name: external links

# bookmarks rot silently; this turns rot into one tracked issue per week
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: weekly bookmark audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --max-retries 2
            --timeout 20
            --accept 200,206,403,429
            --exclude-mail
            "**/*.md"
          output: lychee/out.md
          fail: false

      - name: open an issue when links are dead
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "dead links found in the handbook"
          content-filepath: lychee/out.md
          labels: documentation
