title: ai
author: e-gleba
description: >-
  AI cheatsheet — scenarios, tools, IDEs, prompts, fillers, pipelines.
  Clean interactive UI.
baseurl: ""
url: "https://e-gleba.github.io"

markdown: kramdown
highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md

collections:
  scenarios:
    output: true
  tools:
    output: true
  ides:
    output: true
  prompts:
    output: true
  fillers:
    output: true
  pipelines:
    output: true

defaults:
  - scope:
      path: ""
      type: "scenarios"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "tools"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "ides"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "prompts"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "fillers"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pipelines"
    values:
      layout: "default"